<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>模拟考试页 · 多题型</title></head>
<body>
<div class="questionList">
  <!-- 1 单选（0） -->
  <div class="questionLi" id="q1">
    <input type="hidden" name="type0" value="0">
    <h3 class="mark_name">1、下列哪一项属于 TCP 三次握手的第二步？</h3>
    <ul class="stem_answer">
      <li class="clearfix"><a class="answerBg" href="javascript:;"><div class="answer_p"><div class="textDIV">A. SYN</div></div></a></li>
      <li class="clearfix"><a class="answerBg" href="javascript:;"><div class="answer_p"><div class="textDIV">B. SYN + ACK</div></div></a></li>
      <li class="clearfix"><a class="answerBg" href="javascript:;"><div class="answer_p"><div class="textDIV">C. ACK</div></div></a></li>
      <li class="clearfix"><a class="answerBg" href="javascript:;"><div class="answer_p"><div class="textDIV">D. FIN</div></div></a></li>
    </ul>
  </div>
  <!-- 2 简答（4）：textarea 承载 -->
  <div class="questionLi" id="q2">
    <input type="hidden" name="type1" value="4">
    <h3 class="mark_name">2、简述 TCP 三次握手的过程。</h3>
    <textarea class="eidtDiv"></textarea>
  </div>
  <!-- 3 连线（11）：只有下拉框 -->
  <div class="questionLi" id="q3">
    <input type="hidden" name="type2" value="11">
    <h3 class="mark_name">3、连线：把协议与默认端口配对。</h3>
    <div class="line_answer">
      <div class="line_wid_half fl"><span>HTTP</span></div>
      <div class="line_answer_ct"><select><option>请选择</option><option>80</option><option>443</option></select></div>
      <div class="line_wid_half fl"><span>HTTPS</span></div>
      <div class="line_answer_ct"><select><option>请选择</option><option>80</option><option>443</option></select></div>
    </div>
  </div>
  <!-- 4 听力（17）：页面上只有播放器，没有输入框 -->
  <div class="questionLi" id="q4">
    <input type="hidden" name="type3" value="17">
    <h3 class="mark_name">4、听录音，选出你听到的句子。</h3>
    <audio src="data:audio/mpeg;base64,AAAA" controls></audio>
  </div>
  <!-- 5 排序（13）：有选项、没有输入框 -->
  <div class="questionLi" id="q5">
    <input type="hidden" name="type4" value="13">
    <h3 class="mark_name">5、排序：按时间顺序排列下列事件。</h3>
    <ul class="stem_answer">
      <li class="clearfix"><a class="answerBg" href="javascript:;"><div class="answer_p"><div class="textDIV">A. 事件一</div></div></a></li>
      <li class="clearfix"><a class="answerBg" href="javascript:;"><div class="answer_p"><div class="textDIV">B. 事件二</div></div></a></li>
      <li class="clearfix"><a class="answerBg" href="javascript:;"><div class="answer_p"><div class="textDIV">C. 事件三</div></div></a></li>
    </ul>
  </div>
</div>
<script>
  // 学习通点选模拟：点完给 .answer_p 加 check_answer（单选语义）
  document.querySelectorAll('.stem_answer').forEach(function (ul) {
    ul.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('.answerBg') : null;
      if (!a) return;
      ul.querySelectorAll('.check_answer').forEach(function (x) { x.classList.remove('check_answer'); });
      a.querySelector('.answer_p').classList.add('check_answer');
    });
  });
</script>
</body></html>
